name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the server is Node built-ins only.
      - run: npm test
      - name: config check accepts a sane production env
        run: node --disable-warning=ExperimentalWarning server.js --check-config
        env:
          ADMIN_PIN: '123456'
          API_TOKEN: ci-token-ci-token-ci-token
      - name: config check rejects a bad one
        run: "! node --disable-warning=ExperimentalWarning server.js --check-config"
        env:
          TZ_NAME: Not/AZone

  e2e:
    name: browser end-to-end (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ubuntu-latest ships Google Chrome; the harness drives it over the DevTools protocol (no npm packages).
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  firmware:
    name: door-reader firmware builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/door-reader/.pio
          key: pio-${{ hashFiles('firmware/door-reader/platformio.ini') }}
      - run: pip install platformio
      # config.h holds Wi-Fi + token secrets and is git-ignored; the example compiles the same code paths.
      - run: cp firmware/door-reader/include/config.example.h firmware/door-reader/include/config.h
      - name: plain card reader (BLE_SCAN 0, the default)
        run: pio run
        working-directory: firmware/door-reader
      - name: reader + BLE presence scanner (BLE_SCAN 1)
        run: sed -i 's/#define BLE_SCAN 0/#define BLE_SCAN 1/' include/config.h && grep -q '#define BLE_SCAN 1' include/config.h && pio run
        working-directory: firmware/door-reader

  scripts:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in deploy/*.sh deploy/kiosk-pi/*.sh; do bash -n "$f"; done
      # The Windows desktop reminder: parse with PowerShell (pwsh ships on ubuntu runners). It runs for real in
      # test/desktop.test.js on Windows.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: visitor label agent (selection rules + rendering; no printer)
        run: pip install -q 'pillow>=10' && python -m unittest deploy/kiosk-pi/labels/test_label_agent.py -v
      - name: desktop reminder parses
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/desktop/signin-check.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { $_.Message }; exit 1 }
          if ([IO.File]::ReadAllBytes("$PWD/deploy/desktop/signin-check.ps1") | Where-Object { $_ -gt 127 }) { 'non-ASCII byte: Windows PowerShell 5.1 would misread it'; exit 1 }
