; OPTIONAL door reader: ESP32-S3 + PN532 NFC (I2C) + one push button + built-in RGB LED.
; First compiled + flashed 2026-09-25 (ESP32-S3 16 MB / 8 MB PSRAM via a CH343 UART lead, `pio run -t upload --upload-port COMxx`).
; Serial log goes to the CH343/UART0 port AND native USB (CDC on boot). The USB keyboard-wedge reader on the kiosk needs none of this.
[env:esp32-s3-door-reader]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532@^1.3.3
  adafruit/Adafruit BusIO@^1.16.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; keep the Arduino core quiet: without a PN532 wired, Wire.cpp logged ~60 I2C errors/s (seen 2026-09-25)
  -DCORE_DEBUG_LEVEL=0
