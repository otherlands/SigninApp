; OPTIONAL door reader: ESP32-S3 + PN532 NFC (I2C) + one push button + built-in RGB LED.
; NOT COMPILED IN THIS WORKSPACE (no PlatformIO here). Build on the VS Code PC with `pio run -t upload`
; and verify before trusting it. The USB keyboard-wedge reader on the kiosk needs none of this.
[env:esp32-s3-door-reader]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532@^1.3.3
  adafruit/Adafruit BusIO@^1.16.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
