<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d1a">
    <title>Visitor sign in</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="top">
        <div class="brand">
            <div class="logo"></div>
            <div>
                <h1 id="company">…</h1>
                <div class="clock" id="clock"></div>
            </div>
        </div>
        <a href="/"><button class="ghost">Back to staff</button></a>
    </header>

    <section class="panel hidden" id="expectedPanel">
        <h2>Expected today — tap your name</h2>
        <div id="expected" class="expected"></div>
        <p class="muted" style="margin-top:12px">Not on the list? Use the form below.</p>
    </section>

    <section class="panel" id="formPanel">
        <h2>Visitor sign in</h2>
        <form id="visitorForm" autocomplete="off">
            <label>Your name<input id="name" required maxlength="80" autocapitalize="words"></label>
            <label>Company<input id="company" maxlength="80"></label>
            <label>Who are you visiting?<select id="host">
                    <option value="">— choose —</option>
                </select></label>
            <label>Vehicle registration (if parked on site)<input id="vehicle" maxlength="16"
                    autocapitalize="characters" style="text-transform:uppercase"></label>
            <div class="panel" style="background:var(--panel-2)">
                <h2>Fire safety</h2>
                <p id="fireNotice"></p>
                <label class="row" style="color:var(--text)"><input type="checkbox" id="agree" required
                        style="width:28px;min-height:28px;flex:0 0 28px"> I have read the fire notice</label>
            </div>
            <button class="primary" type="submit" style="width:100%;font-size:1.2rem">Sign in</button>
        </form>
    </section>

    <section class="panel hidden" id="donePanel">
        <p class="notice big" id="doneText"></p>
        <p class="muted" style="text-align:center">Please take the badge shown above. Sign out on the staff screen when
            you leave.</p>
        <a href="/"><button class="primary" style="width:100%">Done</button></a>
    </section>

    <p id="notice" class="notice"></p>

    <script src="/shared.js"></script>
    <script>
        const { $, esc, api, startClock, notice } = SI;
        startClock($('#clock'));
        let state;
        function welcome(visitor) {
            $('#formPanel').classList.add('hidden');
            $('#expectedPanel').classList.add('hidden');
            $('#donePanel').classList.remove('hidden');
            $('#doneText').innerHTML = `Welcome, ${esc(visitor.name)}.<br>Your badge is <b style="font-size:3rem">${visitor.badge}</b>`;
            if (navigator.vibrate) navigator.vibrate(60);
            setTimeout(() => location.href = '/', 20000);
        }
        async function load() {
            state = await api('GET', '/api/state');
            $('#company').textContent = state.companyName;
            $('#fireNotice').textContent = state.fireNotice;
            $('#host').replaceChildren($('#host').firstElementChild, ...state.people.map(p => {
                const o = document.createElement('option'); o.value = p.id; o.textContent = p.name + (p.signedIn ? '' : ' (not in)'); return o;
            }));
            const expected = await api('GET', '/api/expected');
            $('#expectedPanel').classList.toggle('hidden', !expected.length);
            $('#expected').replaceChildren(...expected.map(e => {
                const b = document.createElement('button'); b.className = 'person';
                b.innerHTML = `<strong>${esc(e.name)}</strong><span>${esc([e.company, e.hostName ? `visiting ${e.hostName}` : null].filter(Boolean).join(' · ') || 'pre-registered')}</span>`;
                b.onclick = async () => {
                    if (!confirm(`Sign in as ${e.name}?\n\n${state.fireNotice}`)) return;
                    b.disabled = true;
                    try { const data = await api('POST', `/api/expected/${e.id}/arrive`, { source: 'kiosk' }); welcome(data.visitor); }
                    catch (error) { b.disabled = false; notice($('#notice'), error.message, true); }
                };
                return b;
            }));
        }
        $('#visitorForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const data = await api('POST', '/api/visitors', {
                    name: $('#name').value, company: $('#company').value, hostId: $('#host').value, vehicle: $('#vehicle').value, source: 'kiosk'
                });
                welcome(data.visitor);
            } catch (error) { notice($('#notice'), error.message, true); }
        };
        load().catch(() => notice($('#notice'), 'Unable to reach the sign-in server.', true, 0));
    </script>
</body>

</html>
