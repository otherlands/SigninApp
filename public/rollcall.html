<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#7f1d1d">
    <title>Roll call</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <style>
        .rollcall main {
            width: min(800px, calc(100% - 24px))
        }

        .rollcall .summary {
            background: #7f1d1d;
            flex-wrap: wrap;
            gap: 12px
        }

        .rollcall .summary span {
            font-size: 3.6rem
        }

        .rollcall .summary small {
            color: #fbd5d5
        }

        .roll {
            display: grid;
            gap: 10px
        }

        .roll-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px 12px;
            padding: 16px 18px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid #d6e5de;
            border-left: 10px solid #43a878
        }

        .roll-row strong {
            font-size: 1.5rem
        }

        .roll-row small {
            color: #52716a;
            font-size: 1rem
        }

        .roll-row.stale {
            border-left-color: #d98b0b;
            background: #fff8ea
        }

        .roll-row.stale small {
            color: #8a5a00;
            font-weight: 700
        }

        .offline {
            background: #d98b0b;
            color: #2b1d00;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 14px
        }

        .meta {
            color: #52716a;
            text-align: center;
            margin-top: 16px;
            font-size: .9rem
        }

        @media print {
            body {
                background: #fff
            }

            .summary {
                background: #fff !important;
                color: #000;
                border: 2px solid #000
            }

            .summary small {
                color: #333
            }

            .no-print {
                display: none !important
            }
        }
    </style>
</head>

<body class="rollcall">
    <main>
        <header><a class="back no-print" href="/">← Kiosk</a>
            <div>
                <p id="clock"></p>
                <h1 id="company">Your Company</h1>
            </div>
        </header>
        <div id="offline" class="offline" hidden></div>
        <section class="summary">
            <div><span id="in-count">–</span><small>people on site</small></div>
            <div class="no-print"><button id="print" type="button">Print</button></div>
        </section>
        <section id="roll" class="roll" aria-live="polite"></section>
        <p class="meta">Read-only. Refreshes every 10 s · <span id="updated"></span></p>
    </main>
    <script src="/rollcall.js"></script>
</body>

</html>
