<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d1a">
    <title>Door tap</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="top">
        <div class="brand">
            <div class="logo"></div>
            <h1 id="company">…</h1>
        </div>
    </header>
    <section class="panel" style="text-align:center">
        <h1 id="heading" style="font-size:2rem">Checking…</h1>
        <p id="message" class="muted" style="font-size:1.2rem"></p>
        <div id="picker" class="people hidden" style="margin-top:16px"></div>
        <button id="change" class="ghost hidden" style="margin-top:16px">Not you? Choose a different name</button>
    </section>
    <script src="/shared.js"></script>
    <script>
        // Phone taps an NFC sticker whose URL is http://<server>/tap. First tap: choose your name (remembered on
        // this phone). Every later tap shows where you stand and one big button to change it — never a silent toggle,
        // because browsers reload this page on tab restore and Back navigation.
        const { $, esc, api, fmtTime } = SI;
        const KEY = 'door-tap-person-id';
        let state;
        function showPicker() {
            $('#heading').textContent = 'Who are you?'; $('#message').textContent = 'Your choice is remembered on this phone.';
            $('#picker').classList.remove('hidden'); $('#change').classList.add('hidden');
            $('#picker').replaceChildren(...state.people.map(p => {
                const b = document.createElement('button'); b.className = 'person'; b.innerHTML = `<strong>${esc(p.name)}</strong><span>Use this name</span>`;
                b.onclick = () => { localStorage.setItem(KEY, p.id); confirmTap(p); }; return b;
            }));
        }
        function confirmTap(person) {
            $('#picker').classList.remove('hidden'); $('#change').classList.remove('hidden');
            $('#heading').textContent = person.name;
            $('#message').textContent = person.signedIn ? `You are signed IN (since ${fmtTime(person.since)}).` : 'You are signed OUT.';
            const b = document.createElement('button');
            b.className = `person ${person.signedIn ? '' : 'in'}`;
            b.innerHTML = `<strong>${person.signedIn ? 'Sign me OUT' : 'Sign me IN'}</strong><span>${state.inCount} on site now</span>`;
            b.onclick = () => tap(person.id, person.signedIn ? 'out' : 'in');
            $('#picker').replaceChildren(b);
        }
        async function tap(personId, direction) {
            $('#picker').classList.add('hidden'); $('#heading').textContent = 'Signing…';
            try {
                const data = await api('POST', '/api/sign', { personId, direction, source: 'tap' });
                $('#heading').textContent = data.event.kind === 'in' ? 'You are signed IN' : 'You are signed OUT';
                $('#message').textContent = `${data.event.subjectName} · ${fmtTime(data.event.at)} · ${data.state.inCount} on site`;
                $('#change').classList.remove('hidden');
                if (navigator.vibrate) navigator.vibrate(80);
            } catch (error) {
                // Forget the remembered name only when the server says it no longer exists, not on a network blip.
                if (error.status === 404) localStorage.removeItem(KEY);
                $('#heading').textContent = 'Could not sign you in or out'; $('#message').textContent = error.message + (error.status === 404 ? ' — choose your name again.' : ' — tap the sticker again.');
                $('#change').classList.remove('hidden');
            }
        }
        async function start() {
            try {
                state = await api('GET', '/api/state');
                $('#company').textContent = state.companyName;
                const person = state.people.find(p => p.id === localStorage.getItem(KEY));
                if (!person) return showPicker();
                confirmTap(person);
            } catch { $('#heading').textContent = 'Server unavailable'; $('#message').textContent = 'Connect to the company Wi-Fi and tap again.'; }
        }
        $('#change').onclick = () => { localStorage.removeItem(KEY); showPicker(); };
        start();
    </script>
</body>

</html>
